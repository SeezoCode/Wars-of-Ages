<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="rgb(24, 26, 27)">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_package_v0/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_package_v0/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_package_v0/favicon-16x16.png">
    <link rel="manifest" href="/favicon_package_v0/site.webmanifest">
    <link rel="mask-icon" href="/favicon_package_v0/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
<!--    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="https://cdn.socket.io/socket.io-3.0.0.js"></script>

    <title>Wars of Ages</title>

    <script>
        if ('serviceWorker' in navigator) {
            console.log('ser')
            navigator.serviceWorker.register('/service-worker.js')
        }
    </script>

    <style>
        #cx {
            border: 1px solid lightgray;
        }
        button {
            width: 200px;
            padding: 7px;
            border-radius: 22px;
            border: 0;
            margin: 4px;
            background: rgb(239, 239, 239)
        }
        button[disabled] {
            color: #838383 !important;
            background: rgb(220, 220, 220) !important
        }
        body {
            text-align: center;
            overflow-y: hidden !important;
        }
        html, body {margin: 0; height: 100%; overflow: hidden}
        @media (prefers-color-scheme: dark) {
            button {
                box-shadow:0 0 15px 4px rgb(14, 14, 14);
                background-color: #1c1c1c;
                color: darkgray
            }
            button[disabled] {
                background-color: #262626 !important
            }
            body {
                background: rgb(24, 26, 27);
                color: rgb(241, 241, 241);
            }
            hr {
                border: 1px solid rgb(43, 43, 43);
            }
            .toggle {
                background: rgb(45, 45, 45) !important;
            }
            .indicator {
                background: rgb(235, 235, 235) !important;
            }
            #shBot {
                border-bottom: 1px solid rgb(50, 50, 50) !important;
            }
        }
        * {
            box-sizing: border-box;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
        }
        @media only screen and (min-height: 530px) {
            .vertical-center {
                margin: 0;
                position: absolute;
                top: 50%;
                left: 50%;
                -ms-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);
            }
        }
        @media only screen and (min-height: 900px) {
            .vertical-center {
                margin: 0;
                position: absolute;
                top: 46%;
                left: 50%;
                -ms-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);
            }
        }
        /*@media only screen and (max-width: 440px) {*/
        /*    button {*/
        /*        width: auto !important;*/
        /*    }*/
        /*}*/
        /*@media only screen and (max-width: 477px) {*/
        /*    button {*/
        /*        width: 145px;*/
        /*    }*/
        /*}*/
        /* two columns side by side (left player | right player) without depending on the bootstrap CDN */
        #shBot > .row, #controls, .picker-row { display: flex; flex-wrap: nowrap }
        #shBot > .row > .col, #controls > .col, .picker-row > .col { flex: 1 1 0; min-width: 0 }
        #controls > br { display: none }
        .picker { width: 100%; margin: 3px 0; padding: 3px 6px; border-radius: 8px; border: 1px solid #ccc;
                  background: white; color: black; font-size: 14px }
        .picker-inline { width: auto; display: inline-block }
        .picker-side { padding: 4px 6px }
        .picker-title { font-weight: 600 }
        .picker-small { font-size: 12px; color: #888; display: block; margin: 2px 0; text-align: left }
        .picker-small input[type=file] { font-size: 11px; max-width: 100% }
        .picker-options { font-size: 14px; margin-top: 6px }
        .picker-options label { margin: 0 6px }
        @media (prefers-color-scheme: dark) {
            .picker { background: #1c1c1c; color: rgb(220, 220, 220); border-color: #444 }
        }
        .label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .label-text {
            margin-left: 8px;
        }

        .toggle {
            isolation: isolate;
            position: relative;
            height: 24px;
            width: 48px;
            border-radius: 15px;
            background: #d6d6d6;
            overflow: hidden;
        }

        .toggle-inner {
            z-index: 2;
            position: absolute;
            top: 1px;
            left: 1px;
            height: 22px;
            width: 46px;
            border-radius: 15px;
            overflow: hidden;
        }

        .active-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 200%;
            background: #003dda;
            transform: translate3d(-100%, 0, 0);
            transition: transform 0.05s linear 0.17s;
        }

        .toggle-state {
            display: none;
        }

        .indicator {
            height: 100%;
            width: 200%;
            background: white;
            border-radius: 13px;
            transform: translate3d(-75%, 0, 0);
            transition: transform 0.35s cubic-bezier(0.85, 0.05, 0.18, 1.35);
        }

        .toggle-state:checked ~ .active-bg {
            transform: translate3d(-50%, 0, 0);
        }

        .toggle-state:checked ~ .toggle-inner .indicator {
            transform: translate3d(25%, 0, 0);
        }

        #shBot {
            /*border-bottom-style: 1px solid black;*/
            border-bottom: 1px solid lightgray;
            height: 55px;
            display: none;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>

</head>
<!--; -->
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin-top: 0; margin-bottom: 0;">
    <div id="startingScreen" class="vertical-center">
        <h1>Wars of Ages</h1>
        <p style="color: #c3c3c3">Filip Hostinský</p>
        <div id="menuButtons">
        <button id="customBtn" style="font-weight: 600">Custom match…</button><br>
        <button id="pl">Player vs Player</button>
        <button id="bot">Player vs AI</button>
        <button id="bot2">Player vs genAI</button>
        <button id="bot3">Player vs reinforcement AI</button>
        <button id="bot4">Reinforcement vs reinforcement AI</button>
        <button id="bot5">Player vs local reinforcement AI</button>
        <button id="bot6">local reinforcement AI</button>
        <button id="bot7">old bot vs local reinforcement AI</button>
        <button id="bot8">Player vs Ultimate AI</button>
        <button id="bot9">old bot vs Ultimate AI</button>
        <button id="bot10">local reinforcement AI vs Ultimate AI</button>
        </div>
        <div id="customPanel" style="display: none; max-width: 520px; margin: 0 auto">
            <h5 style="margin-top: 6px">Custom match</h5>
            <div class="row picker-row" style="margin: 0">
                <div class="col picker-side">
                    <div class="picker-title" style="color: royalblue">Left</div>
                    <select id="leftKind" class="picker"></select>
                    <label class="picker-small">Max troops <input id="leftMax" class="picker picker-inline" type="number" min="1" max="50" style="width: 60px"></label>
                    <div id="leftModelBox" class="picker-model">
                        <input id="leftModel" class="picker" type="text" placeholder="model URL">
                        <label class="picker-small">or file: <input id="leftFile" type="file" accept=".json,application/json"></label>
                        <label id="leftGreedyBox" class="picker-small"><input id="leftGreedy" type="checkbox"> always best move (greedy)</label>
                    </div>
                </div>
                <div class="col picker-side">
                    <div class="picker-title" style="color: crimson">Right</div>
                    <select id="rightKind" class="picker"></select>
                    <label class="picker-small">Max troops <input id="rightMax" class="picker picker-inline" type="number" min="1" max="50" style="width: 60px"></label>
                    <div id="rightModelBox" class="picker-model">
                        <input id="rightModel" class="picker" type="text" placeholder="model URL">
                        <label class="picker-small">or file: <input id="rightFile" type="file" accept=".json,application/json"></label>
                        <label id="rightGreedyBox" class="picker-small"><input id="rightGreedy" type="checkbox"> always best move (greedy)</label>
                    </div>
                </div>
            </div>
            <div class="picker-options">
                <label>Speed <select id="pickSpeed" class="picker picker-inline">
                    <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option>
                </select></label>
                <label>Money <input id="pickMoney" class="picker picker-inline" type="number" min="0" value="55" style="width: 70px"></label>
                <label>Draw after <input id="pickLimit" class="picker picker-inline" type="number" min="0" value="15" style="width: 55px"> min</label>
                <label><input id="pickRepeat" type="checkbox"> auto-repeat (bots only)</label>
            </div>
            <p class="picker-small" style="margin: 2px 0 6px">Speed 1× = normal game speed. "Draw after" uses game time (0 = no limit). Empty max troops = default
                (the AIs were trained with Ultimate/DQN 10, Classic 7; the Ultimate AI only sees its first 10 units).</p>
            <button id="pickSwap" class="keep-size" style="width: 120px">⇄ Swap</button>
            <button id="pickStart" class="keep-size" style="width: 160px; font-weight: 600">Start</button>
            <button id="pickBack" class="keep-size" style="width: 120px">Back</button>
        </div>
        <br> <hr>
        <p id="onlineIndicator">Play online</p>
        <button id="mul1">Multiplayer Server</button>
        <button id="mul" style="display:none">Connect with code</button>
        <button id="code" style="display:none">Generate code</button>

        <br><hr>
        <label class="label">
            <a href="guide.html" style="margin-right: 20px">Guide</a>
            <div class="label-text" style="margin-right: 7px">Music</div>
            <div class="toggle">
                <input class="toggle-state" type="checkbox" name="check" id="music" value="check" />
                <div class="toggle-inner">
                    <div class="indicator"></div>
                </div>
                <div class="active-bg"></div>
            </div>
        </label>
    </div>


    <div id="matchInfo" style="display: none; font-size: 14px; margin: 4px auto 2px; max-width: 700px">
        <span id="matchText"></span>
        <button id="matchRematch" class="keep-size" style="width: auto; padding: 2px 12px; margin: 0 4px">Rematch</button>
        <button id="matchMenu" class="keep-size" style="width: auto; padding: 2px 12px; margin: 0 4px">Menu</button>
    </div>
    <canvas id="cx" style="overflow-x: auto; width: 100%; max-width: 700px; display: none; padding: 0; margin-bottom: 0"></canvas>
    <script type="module" src="index.js"></script>

    <div id="shBot">
        <div class="row" style="max-width: 700px; text-align: center; margin-left: auto; margin-right: auto; margin-bottom: 0; padding-bottom: 0">
            <div class="col">
                <p id="leftMoney" style="display: none">Money: 55</p>
                <p id="trsleft"></p>
            </div>
            <div class="col">
                <p id="rightMoney" style="display: none">Money: 55</p>
                <p id="trsright"></p>

            </div>
        </div>
    </div>

    <div id="controls" class="row" style="margin-top: 0; max-width: 700px; display: none; margin-left: auto; margin-right: auto; overflow-y: scroll">
        <div id="left" class="col" style="overflow:auto">
            <p></p>
            <p id="unlleft"></p>
            <p id="perleft" style="color: rgba(100, 100, 100, .4)"></p>
            <p id="pullleft" style="color: rgba(100, 100, 100, .4)"></p>
            <p id="statsleft"></p>
            <div id="ai-stats-left"></div>

        </div>
        <br>
        <div id="right" class="col" style="overflow:auto; margin-bottom: 35px">
            <p></p>
            <p id="unlright"></p>
            <p id="perright" style="color: rgba(100, 100, 100, .4)"></p>
            <p id="pullright" style="color: rgba(100, 100, 100, .4)"></p>
            <p id="statsright"></p>
            <div id="ai-stats-right"></div>

        </div>
    </div>


</body>
</html>
