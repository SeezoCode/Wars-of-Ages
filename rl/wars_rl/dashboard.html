<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wars of Ages training</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --critical: #d03b3b; --neutral: #a9a8a1; --good-text: #006300;
  --hover: rgba(11,11,11,0.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --neutral: #6b6a65; --good-text: #0ca30c; --hover: rgba(255,255,255,0.05);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --neutral: #6b6a65; --good-text: #0ca30c; --hover: rgba(255,255,255,0.05);
}
* { box-sizing: border-box }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif }
header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface) }
header h1 { font-size: 17px; margin: 0; font-weight: 650 }
#sys { color: var(--ink-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-variant-numeric: tabular-nums }
#sys b { color: var(--ink); font-weight: 600 }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 50px) }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr } }
aside { border-right: 1px solid var(--border); padding: 14px; background: var(--surface) }
main { padding: 16px 20px 60px; min-width: 0 }
h2 { font-size: 15px; margin: 22px 0 8px; font-weight: 650 }
h2:first-child { margin-top: 0 }
.muted { color: var(--muted) } .small { font-size: 12px } .ink2 { color: var(--ink-2) }
button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer }
button:hover { background: var(--hover) }
button.primary { background: var(--accent); color: white; border-color: transparent; font-weight: 600 }
button.danger { color: var(--critical) }
button:disabled { opacity: .5; cursor: default }
input, select { font: inherit; padding: 4px 7px; border-radius: 6px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink) }
input[type=number] { width: 120px } input[type=text] { width: 180px }
.runlist { list-style: none; padding: 0; margin: 8px 0 }
.runlist li { padding: 7px 9px; border-radius: 8px; cursor: pointer; margin-bottom: 2px }
.runlist li:hover { background: var(--hover) }
.runlist li.sel { background: var(--hover); outline: 1px solid var(--border) }
.runlist .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2) }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--neutral) }
.pill.on::before { background: var(--good) }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)) }
.charts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)) }
@media (max-width: 520px) { .charts { grid-template-columns: 1fr } }
.score-big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: .5px }
.score-title { font-weight: 600; display: flex; align-items: center; gap: 7px }
.key { display: inline-block; width: 14px; height: 2px; border-radius: 2px }
.wdl { display: flex; gap: 2px; height: 10px; margin: 8px 0 4px }
.wdl span { display: block; height: 100%; border-radius: 3px; min-width: 0 }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap }
th { color: var(--ink-2); font-weight: 600; font-size: 12px }
.tablewrap { overflow-x: auto }
.res-W { color: var(--good-text); font-weight: 600 } .res-L { color: var(--critical); font-weight: 600 } .res-D { color: var(--ink-2) }
pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; overflow: auto; max-height: 340px; font-size: 12px; margin: 0 }
details.section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px }
details.section > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; list-style-position: inside }
details.section .body { padding: 0 14px 12px }
.adv { font-size: 11px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--border); border-radius: 10px; padding: 1px 7px; margin-left: 6px }
.intro { color: var(--ink-2); margin: 0 0 10px; max-width: 760px }
.field { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 4px 14px; padding: 7px 0; border-top: 1px solid var(--grid) }
.field label { font-weight: 550 }
.field .help { grid-column: 2; color: var(--muted); font-size: 12px; max-width: 640px }
.field.changed label::after { content: " •"; color: var(--accent) }
@media (max-width: 600px) { .field { grid-template-columns: 1fr } .field .help { grid-column: 1 } }
.chart-card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600 }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 4px 0 2px }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.chart { position: relative }
.chart svg { display: block; width: 100%; overflow: visible }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 5 }
.tip .v { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums } .tip .n { color: var(--ink-2) }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px; cursor: pointer }
.err { color: var(--critical) } .note { color: var(--ink-2); font-size: 13px }
.empty { color: var(--muted); padding: 30px; text-align: center }
</style>
</head>
<body>
<header>
  <h1>Wars of Ages · training</h1>
  <div id="sys">loading…</div>
</header>
<div class="layout">
  <aside>
    <button class="primary" id="newRunBtn" style="width: 100%">+ New training run</button>
    <h2 style="margin-top: 16px">Runs</h2>
    <ul class="runlist" id="runlist"></ul>
    <h2>Jobs</h2>
    <div id="jobs" class="small muted">none yet</div>
  </aside>
  <main id="main"><div class="empty">Pick a run on the left or start a new one.</div></main>
</div>

<script>
'use strict'
// ---------- tiny helpers (textContent only: run names, opponents and logs are data) ----------
const $ = s => document.querySelector(s)
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue
    if (k === 'class') e.className = v
    else if (k === 'style') e.setAttribute('style', v)
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
    else if (k in e && typeof v !== 'string') e[k] = v
    else e.setAttribute(k, v === true ? '' : v)
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
  return e
}
const svgNS = 'http://www.w3.org/2000/svg'
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(svgNS, tag)
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v)
  for (const kid of kids) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)))
  return e
}
async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {})
  const j = await r.json()
  if (!r.ok) throw new Error(j.error || r.statusText)
  return j
}
const fmtN = n => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k' : String(Math.round(n))
const pct = v => v == null ? '–' : Math.round(v * 100) + '%'
const ago = t => { const d = Date.now() / 1000 - t; return d < 90 ? Math.round(d) + ' s ago' : d < 5400 ? Math.round(d / 60) + ' min ago' : d < 129600 ? Math.round(d / 3600) + ' h ago' : Math.round(d / 86400) + ' d ago' }

// opponent identity -> fixed categorical slot (never re-assigned by rank)
const OPP = {
  classic: {label: 'Classic AI', color: 'var(--s1)'},
  dqn: {label: 'Old RL AI (DQN)', color: 'var(--s2)'},
  past: {label: 'Past versions', color: 'var(--s3)'},
  random: {label: 'Random', color: 'var(--s4)'},
  self: {label: 'Itself (mirror)', color: 'var(--neutral)'},
}
const OPP_ORDER = ['classic', 'dqn', 'past', 'random', 'self']
const oppLabel = k => (OPP[k] || {label: k}).label

const ENDED = {finished: 'finished', stopped: 'stopped', crashed: 'crashed', killed: 'killed'}
// ---------- state ----------
let SCHEMA = null, POLICIES = [], selected = null, view = 'empty', lastDetail = null, formState = null

// ---------- line chart (SVG; crosshair tooltip; direct end labels; table view) ----------
function lineChart({title, subtitle, series, yMax, yMin, yFmt = v => v.toFixed(2), xFmt = fmtN, xLabel = 'decisions trained', marks = []}) {
  const card = h('div', {class: 'card chart-card'})
  const tableBtn = h('button', {class: 'linkbtn'}, 'table')
  card.append(h('div', {class: 'chart-head'}, h('div', {}, h('h3', {}, title), subtitle ? h('div', {class: 'small muted'}, subtitle) : null), tableBtn))
  const live = series.filter(s => s.points.length)
  if (!live.length) { card.append(h('div', {class: 'empty small'}, 'no data yet')); return card }
  if (live.length >= 2) card.append(h('div', {class: 'legend'}, live.map(se => h('span', {}, h('i', {class: 'key', style: `background:${se.color}`}), se.name))))
  const box = h('div', {class: 'chart'}); card.append(box)
  const tip = h('div', {class: 'tip'}); box.append(tip)
  let showTable = false
  tableBtn.onclick = () => { showTable = !showTable; tableBtn.textContent = showTable ? 'chart' : 'table'; draw() }
  const W = 640, H = 210, L = 46, R = 92, T = 10, B = 30
  const xs = [...new Set(live.flatMap(se => se.points.map(p => p[0])))].sort((a, b) => a - b)
  const xmin = xs[0], xmax = xs[xs.length - 1] === xmin ? xmin + 1 : xs[xs.length - 1]
  const vals = live.flatMap(se => se.points.map(p => p[1]))
  let ymax = yMax ?? Math.max(1e-9, ...vals)
  if (yMax == null) { const m = Math.pow(10, Math.floor(Math.log10(ymax))); ymax = Math.ceil(ymax / m * 1.05) * m }
  let ymin = yMin ?? Math.min(0, ...vals)
  if (ymin < 0 && yMin == null) { const m = Math.pow(10, Math.floor(Math.log10(-ymin))); ymin = -Math.ceil(-ymin / m) * m }
  const X = x => L + (x - xmin) / (xmax - xmin) * (W - L - R)
  const Y = y => T + (1 - (y - ymin) / (ymax - ymin)) * (H - T - B)
  function draw() {
    box.querySelectorAll('svg, .tablewrap').forEach(e => e.remove())
    if (showTable) {
      const rows = xs.slice(-15).reverse()
      box.append(h('div', {class: 'tablewrap'}, h('table', {},
        h('tr', {}, h('th', {}, xLabel), live.map(se => h('th', {}, se.name))),
        rows.map(x => h('tr', {}, h('td', {}, xFmt(x)), live.map(se => { const p = se.points.find(p => p[0] === x); return h('td', {}, p ? yFmt(p[1]) : '–') }))))))
      return
    }
    const svg = s('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': title})
    for (let i = 0; i <= 4; i++) {
      const v = ymin + (ymax - ymin) * i / 4, y = Y(v)
      svg.append(s('line', {x1: L, x2: W - R, y1: y, y2: y, stroke: Math.abs(v) < 1e-12 || (i === 0 && ymin >= 0) ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1}))
      svg.append(s('text', {x: L - 6, y: y + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)'}, yFmt(v)))
    }
    for (let i = 0; i <= 4; i++) {
      const v = xmin + (xmax - xmin) * i / 4
      svg.append(s('text', {x: X(v), y: H - 10, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', 'font-size': 11, fill: 'var(--muted)'}, xFmt(v)))
    }
    for (const m of marks) {  // settings changed during the run
      if (m.x < xmin || m.x > xmax) continue
      const ln = s('line', {x1: X(m.x), x2: X(m.x), y1: T, y2: H - B, stroke: 'var(--ink-2)', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0.7})
      ln.append(s('title', {}, m.label)); svg.append(ln)
    }
    const ends = []
    for (const se of live) {
      const d = se.points.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ')
      svg.append(s('path', {d, fill: 'none', stroke: se.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': se.dash || 'none'}))
      const last = se.points[se.points.length - 1]
      ends.push({se, y: Y(last[1]), v: last[1], x: X(last[0])})
    }
    // direct labels at line ends, nudged apart
    ends.splice(0, ends.length, ...ends.filter(e => e.se.label !== false))  // unlabeled series: legend only
    ends.sort((a, b) => a.y - b.y)
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13
    for (const e of ends) {
      svg.append(s('circle', {cx: e.x, cy: Y(e.v), r: 3.5, fill: e.se.color, stroke: 'var(--surface)', 'stroke-width': 2}))
      svg.append(s('text', {x: W - R + 8, y: e.y + 4, 'font-size': 11, fill: 'var(--ink-2)'}, `${yFmt(e.v)} ${live.length > 1 ? e.se.short || e.se.name : ''}`))
    }
    const cross = s('line', {y1: T, y2: H - B, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden'})
    svg.append(cross)
    const hit = s('rect', {x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent'})
    svg.append(hit)
    hit.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W
      const xv = xmin + (px - L) / (W - L - R) * (xmax - xmin)
      let best = xs[0]; for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x
      cross.setAttribute('x1', X(best)); cross.setAttribute('x2', X(best)); cross.setAttribute('visibility', 'visible')
      tip.replaceChildren(h('div', {class: 'n'}, `${xFmt(best)} ${xLabel}`), ...live.map(se => {
        const p = se.points.find(p => p[0] === best)
        return h('div', {}, h('i', {class: 'key', style: `background:${se.color};margin-right:6px;vertical-align:middle`}), h('span', {class: 'v'}, p ? yFmt(p[1]) : '–'), ' ', h('span', {class: 'n'}, se.name))
      }))
      tip.style.display = 'block'
      const bx = box.getBoundingClientRect(), left = X(best) / W * r.width
      tip.style.left = Math.min(left + 12, bx.width - tip.offsetWidth - 4) + 'px'
      tip.style.top = '8px'
    })
    hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden') })
    box.prepend(svg)
  }
  draw()
  return card
}

// ---------- sidebar ----------
async function refreshRuns() {
  const runs = await api('/api/runs')
  const ul = $('#runlist')
  ul.replaceChildren(...runs.map(r => h('li', {class: r.name === selected && view === 'run' ? 'sel' : '', onclick: () => openRun(r.name)},
    h('div', {class: 'row', style: 'justify-content: space-between'}, h('b', {}, r.name), h('span', {class: 'pill' + (r.running ? ' on' : '')}, r.running ? 'training' : 'stopped')),
    h('div', {class: 'meta'}, r.update ? `update ${r.update} · ${fmtN(r.env_steps)} decisions` : 'no updates yet'))))
  if (!runs.length) ul.append(h('li', {class: 'muted small'}, 'No runs yet.'))
}
async function refreshSystem() {
  try {
    const s = await api('/api/system')
    const parts = [h('span', {}, h('b', {}, s.cores), ' CPU cores')]
    if (s.cpu_percent != null) parts.push(h('span', {}, 'CPU ', h('b', {}, Math.round(s.cpu_percent) + '%')))
    if (s.load) parts.push(h('span', {}, 'load ', h('b', {}, s.load.map(x => x.toFixed(1)).join(' / '))))
    if (s.mem_total_gb) parts.push(h('span', {}, 'RAM ', h('b', {}, `${s.mem_used_gb.toFixed(1)} / ${s.mem_total_gb.toFixed(1)} GB`)))
    for (const t of s.trainers) parts.push(h('span', {}, `${t.run}: `, h('b', {}, t.cpu_percent != null ? Math.round(t.cpu_percent) + '% CPU' : 'running'), t.mem_gb != null ? `, ${t.mem_gb.toFixed(1)} GB` : ''))
    if (!s.psutil && s.cpu_percent == null) parts.push(h('span', {class: 'muted'}, '(pip install psutil for CPU %)'))
    $('#sys').replaceChildren(...parts)
  } catch (e) { $('#sys').textContent = 'dashboard server not reachable' }
}
async function refreshJobs() {
  const jobs = await api('/api/jobs')
  const el = $('#jobs')
  if (!jobs.length) { el.textContent = 'none yet'; return }
  el.replaceChildren(...jobs.slice(0, 8).map(j => h('div', {style: 'margin-bottom: 8px'},
    h('div', {class: 'ink2'}, j.title),
    h('div', {class: j.status.startsWith('failed') ? 'err' : ''}, j.status === 'running' ? `running… ${j.output[j.output.length - 1] || ''}` : j.status))))
}

// ---------- run view ----------
async function openRun(name) {
  selected = name; view = 'run'; lastDetail = null
  $('#main').replaceChildren(h('div', {class: 'empty'}, 'loading…'))
  await refreshRun(true)
  refreshRuns()
}
async function refreshRun(force) {
  if (view !== 'run' || !selected) return
  let d
  try { d = await api('/api/run?name=' + encodeURIComponent(selected)) } catch (e) { return }
  const sig = JSON.stringify([d.running, d.latest && d.latest.update, d.recent.length && d.recent[0].time, d.evals.length, d.output.slice(-3), d.changes.length, d.pending, d.restarting])
  if (!force && lastDetail === sig) return
  lastDetail = sig
  renderRun(d)
}
let lastRunData = null
function renderRun(d) {
  lastRunData = d
  const main = $('#main')
  const keepScroll = window.scrollY
  const last = d.latest || {}
  const head = h('div', {class: 'row', style: 'justify-content: space-between; margin-bottom: 12px'},
    h('div', {}, h('div', {class: 'row'}, h('h2', {style: 'margin:0;font-size:19px'}, d.name), h('span', {class: 'pill' + (d.running ? ' on' : '')}, d.running ? `training (pid ${d.pid})` : ENDED[d.ended && d.ended.state] || 'stopped')),
      h('div', {class: 'small muted'}, last.update ? `update ${last.update} · ${fmtN(last.env_steps)} of ${fmtN(d.config.total_env_steps)} decisions · ${fmtN(last.episodes)} games · ${fmtN(last.sps)} decisions/s` : 'waiting for the first update…')),
    h('div', {class: 'row'},
      d.restarting ? h('span', {class: d.restarting.endsWith('…') ? 'note' : 'err'}, 'Restart: ' + d.restarting) : null,
      d.running ? h('button', {class: 'primary', onclick: () => openForm(d.name, d.config, d.latest || {})}, 'Change settings…') : null,
      d.running ? h('button', {class: 'danger', onclick: () => act('/api/stop', {name: d.name}, 'Stopping (saves first)…')}, 'Stop (saves)') :
        h('button', {class: 'primary', disabled: !!(d.restarting && d.restarting.endsWith('…')), onclick: () => openForm(d.name, d.config)}, d.has_checkpoint ? 'Resume…' : 'Start…'),
      h('button', {onclick: () => openForm(null, d.config)}, 'Copy settings to new run'),
      h('button', {disabled: !d.has_checkpoint, onclick: () => exportDialog(d.name)}, 'Export model')))
  main.replaceChildren(head)
  if (d.ended && ['crashed', 'killed'].includes(d.ended.state)) main.append(h('div', {class: 'card', style: 'margin-bottom:12px; border-color: var(--critical)'},
    h('div', {}, h('b', {class: 'err'}, d.ended.state === 'crashed' ? 'Training crashed' : 'Training was killed'),
      h('span', {class: 'muted'}, (d.ended.time ? ` ${ago(d.ended.time)}` : '') + (d.ended.update ? ` · at update ${d.ended.update}` : ''))),

    hist.length ? h('div', {style: 'margin-top:6px'}, h('div', {class: 'small'}, h('b', {}, 'Changed during training'), h('span', {class: 'muted'}, ' (dashed lines on the charts)')), hist) : null)

const REWARD_SERIES = {

let rewardFilter = 'all'
function rewardSection(d) {

  if (!R || !R.over_training.all || !R.over_training.all.length) {
    wrap.append(h('div', {class: 'card muted'}, 'No reward data yet: no game has finished since reward logging was added (runs trained with older code don\'t have it).'))

  const groups = ['all'].concat(OPP_ORDER.filter(k => R.over_training[k]))
  if (!groups.includes(rewardFilter)) rewardFilter = 'all'

    groups.map(g => h('option', {value: g, selected: g === rewardFilter}, g === 'all' ? 'all opponents' : oppLabel(g))))
  wrap.append(h('div', {class: 'row', style: 'margin-bottom:8px'}, 'Games against ', sel,

  const sum = parts => parts.reduce((a, b) => a + b, 0)

  const du = R.during[rewardFilter]
  const fmt = v => (v > 0 ? '+' : '') + v.toFixed(2)
  wrap.append(h('div', {class: 'charts'},
    lineChart({marks: [], title: 'Reward per game, over training', subtitle: 'average total per finished game, by source',
      series: series(i => ot.map(([x, parts]) => [x, i < 0 ? sum(parts) : parts[i]])), yFmt: fmt}),
    du ? lineChart({title: 'Reward during a game', subtitle: `running total by game minute, average of the last ${du.games} games (a finished game keeps its final total)`,
      series: series(i => du.minutes.map((parts, m) => [m + 1, i < 0 ? sum(parts) : parts[i]])), yFmt: fmt, xFmt: v => +v.toFixed(1) + ' min', xLabel: 'game minute'}) : null))

      'about zero or slightly negative; what matters to the AI is that it gets them early (see "Reward during a game").'),
    h('table', {}, h('tr', {}, h('th', {}, 'result'), h('th', {}, 'games'), R.parts.map(p => h('th', {}, REWARD_SERIES[p].name)), h('th', {}, 'Total')),

        br[k].parts.map(v => h('td', {}, fmt(v))), h('td', {}, h('b', {}, fmt(sum(br[k].parts)))))))))
  return wrap
}

// ---------- settings form ----------
function openForm(resumeName, baseConfig, liveNow) {
  // liveNow (the latest log row) = change the settings of a run that is training right now
  const isLive = !!liveNow
  $('#main').oninput = $('#main').onchange = null
  view = 'form'; selected = resumeName; lastDetail = null
  refreshRuns()
  const defaults = {}
  for (const sec of SCHEMA.sections) for (const f of sec.fields) defaults[f.name] = f.default
  const values = {...defaults}
  if (baseConfig) for (const k of Object.keys(defaults)) if (baseConfig[k] !== undefined) values[k] = baseConfig[k]
  for (const k of ['init_from', 'dqn_model']) if (values[k] && values[k].includes('/rl/')) values[k] = values[k].split('/rl/').pop()
  formState = {values, inputs: {}, defaults: isLive ? {...values} : defaults, live: isLive, now: liveNow}
  const main = $('#main')
  const nameInput = h('input', {type: 'text', value: resumeName || suggestName(), disabled: !!resumeName})
  const preset = h('select', {onchange: () => applyPreset(preset.value)}, h('option', {value: ''}, '— load a preset —'),
    Object.keys(SCHEMA.presets).map(p => h('option', {value: p}, p)))
  main.replaceChildren(
    h('h2', {style: 'font-size:19px'}, isLive ? `Change “${resumeName}” while it trains` : resumeName ? `Resume “${resumeName}”` : 'New training run'),
    isLive ? h('div', {}, h('p', {class: 'intro'}, 'The form shows the run\'s current settings. Settings without a “restart” tag are applied by the running trainer ' +
      'before its next update (usually within a minute), keeping the model, optimizer and league as they are. Settings tagged “restart” are ' +
      'applied by saving, stopping and resuming the run automatically. Changed settings are marked with •.'),
      h('p', {class: 'intro'}, 'Learning rate and entropy bonus slide from their start value to their end value over the run, so the value used right now ' +
      'is in between (shown next to them). To pin a value from now on, set start and end to the same number. Changing the training length moves the run\'s ' +
      'position in every schedule (learning rate, entropy, reward hints, random moves).')) :
    h('p', {class: 'intro'}, resumeName ?
      'Continues from the run\'s latest checkpoint (model, optimizer, league and schedules). You can change most settings; network sizes must stay the same.' :
      'Pick a preset or change any setting below. The sections at the bottom are for experimenting with the AI itself; each explains what it does. Changed settings are marked with •.'),
    h('div', {class: 'card row', style: 'margin-bottom:12px'}, 'Run name ', nameInput, resumeName ? null : preset,
      isLive ? h('button', {onclick: () => openForm(resumeName, baseConfig, liveNow)}, 'Undo my changes') :
        h('button', {onclick: () => { openForm(resumeName, null) }}, 'Reset to defaults')))
  for (const sec of SCHEMA.sections) {
    const det = h('details', {class: 'section', open: !sec.advanced},
      h('summary', {}, sec.name, sec.advanced ? h('span', {class: 'adv'}, 'advanced') : null),
      h('div', {class: 'body'}, sec.intro ? h('p', {class: 'intro'}, sec.intro) : null, sec.fields.map(f => fieldRow(f, values, !!resumeName))))
    main.append(det)
  }
  const msg = h('span', {class: 'note'})
  const totalWeights = h('span', {class: 'note'})
  if (isLive) return liveButtons(resumeName, msg)
  main.append(h('div', {class: 'row', style: 'margin-top: 14px'},
    h('button', {class: 'primary', onclick: async () => {
      const name = nameInput.value.trim()
      try {
        await api('/api/train', {name, config: collect(), resume: !!resumeName})
        toast('Training started'); await refreshRuns(); openRun(name)
      } catch (e) { msg.textContent = e.message; msg.className = 'err' }
    }}, resumeName ? 'Resume training' : 'Start training'),
    h('button', {onclick: () => resumeName ? openRun(resumeName) : ($('#main').replaceChildren(h('div', {class: 'empty'}, 'Pick a run on the left or start a new one.')), view = 'empty')}, 'Cancel'), msg, totalWeights))
  window.scrollTo(0, 0)

function liveButtons(name, msg) {
  const LIVE = new Set(SCHEMA.live_fields)
  const changed = () => Object.entries(formState.inputs).filter(([k, {f, input}]) => JSON.stringify(read(f, input)) !== JSON.stringify(formState.defaults[k])).map(([k]) => k)
  const btn = h('button', {class: 'primary'})
  const upd = () => {
    const ch = changed(), slow = ch.filter(k => !LIVE.has(k))
    btn.disabled = !ch.length
    btn.textContent = !ch.length ? 'Apply' : slow.length ? 'Save, restart & resume' : `Apply now (no restart)`
    msg.className = 'note'
    msg.textContent = slow.length ? `${slow.map(k => formState.inputs[k].f.label).join(', ')} need${slow.length === 1 ? 's' : ''} a restart (about a minute of saving and loading)` : ''
  }
  btn.onclick = async () => {
    const ch = changed()
    try {
      if (ch.some(k => !LIVE.has(k))) {
        if (!confirm('Save the checkpoint, stop the trainer and resume it with these settings?')) return
        await api('/api/restart', {name, config: collect()})
        toast('Restarting with the new settings…')
      } else {
        await api('/api/live', {name, changes: Object.fromEntries(ch.map(k => [k, read(formState.inputs[k].f, formState.inputs[k].input)]))})
        toast('Sent: applied before the next update')
      }
      openRun(name)
    } catch (e) { msg.textContent = e.message; msg.className = 'err' }
  }
  const form = $('#main'); form.oninput = upd; form.onchange = upd; upd()
  $('#main').append(h('div', {class: 'row', style: 'margin-top: 14px'}, btn, h('button', {onclick: () => openRun(name)}, 'Cancel'), msg))
  window.scrollTo(0, 0)
}
function suggestName() { const d = new Date(); return `run-${d.getMonth() + 1}-${d.getDate()}-${d.getHours()}${String(d.getMinutes()).padStart(2, '0')}` }
function fieldRow(f, values, resuming) {
  let input
  const v = values[f.name]
  const locked = resuming && ['actor_hidden', 'critic_hidden', 'activation', 'layernorm', 'init_from'].includes(f.name)
  if (f.type === 'bool') input = h('input', {type: 'checkbox', checked: !!v})
  else if (f.name === 'activation') input = h('select', {}, ['relu', 'tanh', 'silu'].map(a => h('option', {value: a, selected: a === v}, a)))
  else if (f.name === 'init_from') input = h('select', {}, h('option', {value: ''}, '(random network: train from scratch)'),
    POLICIES.filter(p => p.path.endsWith('.pt')).map(p => h('option', {value: p.path, selected: p.path === v}, p.label)))
  else if (f.type === 'list') input = h('input', {type: 'text', value: (v || []).join(',')})
  else if (f.type === 'str') input = h('input', {type: 'text', value: v ?? '', style: 'width: 320px'})
  else input = h('input', {type: 'number', value: v, step: 'any'})
  if (locked) input.disabled = true
  const restartTag = formState.live && !locked && !SCHEMA.live_fields.includes(f.name) ? h('span', {class: 'adv', title: 'changing this saves, stops and resumes the run'}, 'restart') : null
  const row = h('div', {class: 'field'}, h('label', {}, f.label, restartTag), h('div', {}, input, extraHint(f, input)), f.help ? h('div', {class: 'help'}, f.help) : null)
  const mark = () => row.classList.toggle('changed', JSON.stringify(read(f, input)) !== JSON.stringify(formState.defaults[f.name]))
  input.addEventListener('input', mark); input.addEventListener('change', mark); mark()
  formState.inputs[f.name] = {f, input, row, mark}
  return row
}
function extraHint(f, input) {
  // live helper next to a few fields
  const span = h('span', {class: 'small muted', style: 'margin-left:10px'})
  const upd = () => {
    const x = +input.value
    if (f.name === 'max_ticks') span.textContent = `= ${(x / 3600).toFixed(1)} min of game time`
    else if (f.name === 'decision_interval') span.textContent = `= ${(60 / Math.max(1, x)).toFixed(1)} decisions per second`
    else if (f.name === 'total_env_steps') span.textContent = `≈ ${(x / 1500 / 3600).toFixed(1)}–${(x / 900 / 3600).toFixed(1)} h on 4 cores`
    else if (f.name === 'gamma') span.textContent = x < 1 ? `looks ~${Math.round(1 / (1 - x))} decisions ahead` : ''
    const now = formState.now
    if (now) {
      const nowText = {lr: now.lr, ent_coef: now.ent_coef, explore_eps: now.explore_now, shaping_anneal_frac: now.hints_now != null ? `hints at ${Math.round(now.hints_now * 100)}%` : null}[f.name]
      if (nowText != null) span.textContent += (span.textContent ? ' · ' : '') + 'right now: ' + (typeof nowText === 'number' ? fmtV(nowText) : nowText)
    }
  }
  if (['max_ticks', 'decision_interval', 'total_env_steps', 'gamma', 'lr', 'ent_coef', 'explore_eps', 'shaping_anneal_frac'].includes(f.name)) { input.addEventListener('input', upd); upd(); return span }
  return null
}
function read(f, input) {
  if (f.type === 'bool') return input.checked
  if (f.type === 'list') return input.value.split(',').map(x => parseInt(x.trim())).filter(x => x > 0)
  if (f.type === 'int') return Math.round(+input.value)
  if (f.type === 'float') return +input.value
  return input.value
}
function collect() {
  const out = {}
  for (const [k, {f, input}] of Object.entries(formState.inputs)) out[k] = read(f, input)
  return out
}
function applyPreset(name) {
  if (!name) return
  const p = SCHEMA.presets[name]
  for (const [k, {f, input, mark}] of Object.entries(formState.inputs)) {
    const v = k in p ? p[k] : formState.defaults[k]
    if (f.type === 'bool') input.checked = !!v
    else if (f.type === 'list') input.value = v.join(',')
    else input.value = v
    input.dispatchEvent(new Event('input')); mark()
  }
}

// ---------- boot ----------
$('#newRunBtn').onclick = () => openForm(null, null)
async function boot() {
  SCHEMA = await api('/api/schema')
  POLICIES = await api('/api/policies')
  await refreshRuns(); refreshSystem(); refreshJobs()
  const runs = await api('/api/runs')
  if (runs.length) openRun((runs.find(r => r.running) || runs[0]).name)
  setInterval(refreshSystem, 4000)
  setInterval(() => { refreshRuns(); refreshJobs() }, 5000)
  setInterval(() => refreshRun(false), 3000)
  setInterval(async () => { POLICIES = await api('/api/policies') }, 15000)
}
boot()
</script>
</body>
