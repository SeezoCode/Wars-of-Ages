[package]
name = "wars_engine"
version = "0.1.0"
edition = "2021"
description = "Fast headless Wars of Ages engine (faithful port of index.ts) with an RL environment"

[lib]
name = "wars_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml) to build the Python extension module.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.29", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
